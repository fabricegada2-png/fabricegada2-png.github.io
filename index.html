<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gada Omni Fabrice — Étudiant en informatique, réseaux & web</title>
<meta name="description" content="Portfolio de Gada Omni Fabrice, étudiant en deuxième année d'informatique à l'IAI-Togo (Lomé) : réseaux, VLAN, Cisco Packet Tracer et pages web dynamiques.">
<meta name="theme-color" content="#050607">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050607'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%235eead4'/%3E%3Cg stroke='%23e8ecef' stroke-width='2.5' fill='none'%3E%3Cpath d='M32 25V12M32 39v13M25 32H12M39 32h13'/%3E%3C/g%3E%3Cg fill='%23e8ecef'%3E%3Ccircle cx='32' cy='10' r='4'/%3E%3Ccircle cx='32' cy='54' r='4'/%3E%3Ccircle cx='10' cy='32' r='4'/%3E%3Ccircle cx='54' cy='32' r='4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050607;
    --fg:#e8ecef;
    --dim:#9aa3ab;
    --mute:#5b636b;
    --line:rgba(255,255,255,.11);
    --accent:#5eead4;              /* couleur du routeur central */
    --c:var(--accent);             /* couleur de l'équipement actif */
    --sans:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    --panel-w:min(520px,43vw);
    --pad:clamp(18px,3.2vw,44px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--sans); font-size:16px; -webkit-font-smoothing:antialiased;
    overflow:hidden; overscroll-behavior:none;
  }
  ::selection{background:var(--c); color:#000;}
  a{color:inherit;}
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0;}
  a:focus-visible,button:focus-visible{outline:1px solid var(--c); outline-offset:5px;}
  .mono{font-family:var(--mono); font-size:.72rem; letter-spacing:.04em;}

  /* ---------- scène ---------- */
  #scene{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab;}
  #scene.dragging{cursor:grabbing;}
  #scene.hover{cursor:pointer;}
  .shade{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(5,6,7,.85) 100%);
  }

  /* ---------- chargement : un ping ---------- */
  #loader{position:fixed; inset:0; z-index:50; background:var(--bg); display:grid; place-items:center; padding:24px; transition:opacity 1s ease, visibility 1s;}
  #loader.done{opacity:0; visibility:hidden;}
  #loader pre{margin:0; font-family:var(--mono); font-size:clamp(.66rem,1.6vw,.8rem); line-height:1.9; color:var(--dim); white-space:pre-wrap; max-width:560px; width:100%;}
  #loader pre span{display:block; opacity:0; animation:line .01s forwards;}
  #loader pre span:nth-child(1){animation-delay:.05s; color:var(--fg);}
  #loader pre span:nth-child(2){animation-delay:.35s;}
  #loader pre span:nth-child(3){animation-delay:.6s;}
  #loader pre span:nth-child(4){animation-delay:.85s;}
  #loader pre span:nth-child(5){animation-delay:1.1s; color:var(--accent);}
  #loader pre b{font-weight:400; display:inline-block; width:.6em; background:var(--fg); animation:blink 1s steps(1) infinite;}
  @keyframes line{to{opacity:1;}}
  @keyframes blink{50%{opacity:0;}}

  /* ---------- en-tête ---------- */
  .top{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:28px;
    padding:max(22px, env(safe-area-inset-top)) var(--pad) 0;
  }
  .brand{font-size:1.05rem; font-weight:600; letter-spacing:-.02em;}
  .nav{display:flex; gap:24px; margin-left:auto; overflow-x:auto; scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav button, .mode{color:var(--mute); padding:6px 0; white-space:nowrap; transition:color .25s; position:relative; font-family:var(--mono); font-size:.74rem; letter-spacing:.03em;}
  .nav button:hover, .mode:hover{color:var(--fg);}
  .nav button.on{color:var(--fg);}
  .mode{border-left:1px solid var(--line); padding-left:24px;}

  /* ---------- HUD : état du routeur ---------- */
  .hud{
    position:fixed; z-index:12; left:var(--pad); top:calc(max(22px, env(safe-area-inset-top)) + 46px);
    color:var(--mute); line-height:1.9; pointer-events:none; transition:opacity .5s;
  }
  .hud b{font-weight:400; color:var(--dim); font-variant-numeric:tabular-nums;}
  #hud-route{color:var(--dim); min-height:1.9em; transition:color .3s;}
  #hud-route.live{color:var(--fg);}
  body.flat .hud{display:none;}

  /* ---------- accueil ---------- */
  .hero{
    position:fixed; z-index:10; left:var(--pad); right:var(--pad); bottom:clamp(30px,7vh,70px);
    pointer-events:none; transition:opacity .7s ease, visibility .7s;
  }
  .hero > *{pointer-events:auto;}
  body:not(.home) .hero{opacity:0; visibility:hidden;}
  .hero .mono{color:var(--dim); margin:0 0 22px;}
  h1{
    font-weight:500; margin:0;
    font-size:clamp(3rem,10vw,9.6rem); line-height:.9; letter-spacing:-.045em;
  }
  h1 > span{display:block; overflow:hidden; padding-bottom:.06em;}
  body.revealed h1 > span{overflow:visible;}
  h1 > span > b{display:block; font-weight:500; transform:translateY(105%); transition:transform 1.2s cubic-bezier(.2,.8,.2,1);}
  h1 > span:nth-child(2) > b{transition-delay:.1s; color:transparent; -webkit-text-stroke:1px var(--fg);}
  body.ready h1 > span > b{transform:none;}
  .hero-foot{display:flex; align-items:flex-end; justify-content:space-between; gap:30px; margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .hero-foot p{margin:0; color:var(--dim); max-width:44ch; line-height:1.6; font-size:.98rem;}
  .enter{
    font-family:var(--mono); font-size:.82rem; white-space:nowrap; display:inline-flex; gap:12px; align-items:center;
    padding:13px 18px; border:1px solid var(--line); border-radius:4px; transition:border-color .25s, background .25s, color .25s;
  }
  .enter:hover{border-color:var(--fg); color:#fff;}
  .enter span[aria-hidden]{display:inline-block; transition:transform .3s;}
  .enter:hover span[aria-hidden]{transform:translateX(5px);}

  /* ---------- étiquettes des équipements ---------- */
  .labels{position:fixed; inset:0; z-index:5; pointer-events:none; overflow:hidden;}
  .label{
    position:absolute; left:0; top:0; pointer-events:auto; will-change:transform;
    color:var(--dim); white-space:nowrap; padding:6px 4px; transition:opacity .4s, color .25s;
    font-family:var(--mono); font-size:.72rem; text-align:center; line-height:1.5;
  }
  .label small{display:block; font-size:.62rem; color:var(--mute);}
  .label:hover,.label.hot{color:var(--fg);}
  .label.hide{opacity:0; pointer-events:none;}

  /* ---------- panneaux ---------- */
  .panel{
    position:fixed; z-index:15; top:0; right:0; bottom:0; width:var(--panel-w);
    display:flex; flex-direction:column;
    padding:clamp(84px,13vh,120px) var(--pad) 0 80px;
    background:linear-gradient(90deg, transparent, rgba(5,6,7,.9) 80px, var(--bg) 60%);
    opacity:0; visibility:hidden; transform:translateX(24px);
    transition:opacity .6s ease, transform .7s cubic-bezier(.2,.8,.2,1), visibility .6s;
  }
  .panel.open{opacity:1; visibility:visible; transform:none;}
  .p-head{flex:none; padding-bottom:26px;}
  .p-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; color:var(--dim);}
  .p-row .mono{display:inline-flex; align-items:center; gap:10px;}
  .p-row .mono::before{content:""; width:6px; height:6px; background:var(--c);}
  .p-ip{color:var(--mute); margin:0 0 20px 16px;}
  .close{width:28px; height:28px; position:relative; opacity:.6; transition:opacity .2s, transform .3s;}
  .close::before,.close::after{content:""; position:absolute; left:3px; right:3px; top:50%; height:1px; background:var(--fg);}
  .close::before{transform:rotate(45deg);} .close::after{transform:rotate(-45deg);}
  .close:hover{opacity:1; transform:rotate(90deg);}
  h2{font-weight:500; font-size:clamp(2rem,3.3vw,3rem); line-height:1.02; letter-spacing:-.035em; margin:0; text-wrap:balance;}
  .p-body{flex:1; overflow-y:auto; padding-bottom:90px; scrollbar-width:none;}
  .p-body::-webkit-scrollbar{display:none;}
  .p-body p{color:var(--dim); line-height:1.7; margin:0 0 16px; font-size:.98rem;}
  .p-body strong{color:var(--fg); font-weight:500;}

  .rows{margin:0 0 20px;}
  .rows > div{display:grid; grid-template-columns:minmax(110px,32%) 1fr; gap:16px; padding:15px 0; border-top:1px solid var(--line);}
  .rows > div:last-child{border-bottom:1px solid var(--line);}
  .rows dt{font-family:var(--mono); font-size:.72rem; color:var(--mute); padding-top:.2em;}
  .rows dd{margin:0; line-height:1.55; font-size:1rem;}

  .proj{padding:22px 0; border-top:1px solid var(--line);}
  .proj:last-child{border-bottom:1px solid var(--line);}
  .proj header{display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin-bottom:10px;}
  .proj h3{font-weight:500; font-size:1.45rem; line-height:1.15; letter-spacing:-.02em; margin:0;}
  .proj .mono{color:var(--mute); flex:none; border:1px solid var(--line); border-radius:3px; padding:2px 7px;}
  .proj .live{color:var(--c); border-color:var(--c);}
  .proj p{margin:0 0 10px;}
  .proj small{font-family:var(--mono); color:var(--mute); font-size:.72rem;}
  .proj h3 a{text-decoration:none; border-bottom:1px solid var(--line); transition:border-color .2s;}
  .proj h3 a:hover{border-color:var(--c);}
  .empty{color:var(--mute);}

  blockquote{margin:0 0 28px; padding-left:18px; border-left:2px solid var(--c); font-size:clamp(1.3rem,2vw,1.7rem); line-height:1.3; letter-spacing:-.02em; color:var(--fg);}

  .goals{list-style:none; margin:0; padding:0; counter-reset:g;}
  .goals li{display:grid; grid-template-columns:48px 1fr; padding:16px 0; border-top:1px solid var(--line); counter-increment:g;}
  .goals li::before{content:counter(g, decimal-leading-zero); font-family:var(--mono); font-size:.8rem; color:var(--c); padding-top:.25em;}
  .goals p{margin:0;}

  .bar{display:grid; grid-template-columns:100px 1fr 40px; align-items:center; gap:16px; padding:10px 0; color:var(--fg);}
  .bar i{height:2px; background:var(--line); display:block; position:relative;}
  .bar i::after{content:""; position:absolute; left:0; top:0; height:2px; width:0; background:var(--c); transition:width 1.3s cubic-bezier(.2,.8,.2,1) .3s;}
  .bar em{font-style:normal; font-family:var(--mono); font-size:.72rem; color:var(--mute); text-align:right;}
  .panel.open .bar i::after, body.flat .bar i::after{width:var(--w);}
  .sub{font-family:var(--mono); font-size:.72rem; color:var(--mute); margin:26px 0 10px; padding-top:18px; border-top:1px solid var(--line);}

  .links{margin:8px 0 26px;}
  .links a{
    display:flex; align-items:baseline; justify-content:space-between; gap:14px; text-decoration:none;
    padding:17px 0; border-top:1px solid var(--line);
    font-size:clamp(1.15rem,1.7vw,1.45rem); letter-spacing:-.02em; line-height:1.15; overflow-wrap:anywhere;
    transition:color .2s, padding .3s;
  }
  .links a:last-child{border-bottom:1px solid var(--line);}
  .links a::after{content:"→"; font-family:var(--mono); font-size:.9rem; color:var(--mute); transition:transform .3s, color .3s;}
  .links a:hover{color:#fff; padding-left:8px;}
  .links a:hover::after{transform:translateX(4px); color:var(--c);}

  /* ---------- pas à pas ---------- */
  .dock{
    position:fixed; z-index:20; left:var(--pad); bottom:max(26px, env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:14px; color:var(--dim); transition:opacity .5s, visibility .5s;
  }
  body:not(.viewing) .dock{opacity:0; visibility:hidden;}
  .dock button{font-family:var(--mono); font-size:.95rem; padding:7px 10px; color:var(--dim); border:1px solid var(--line); border-radius:4px; transition:color .2s, border-color .2s;}
  .dock button:hover{color:var(--fg); border-color:var(--c);}
  .dock span{min-width:58px; text-align:center; font-variant-numeric:tabular-nums;}

  footer{display:none;}

  /* ---------- mobile ---------- */
  @media (max-width:820px){
    .top{flex-wrap:wrap; gap:14px 20px;}
    .mode{margin-left:auto; border:0; padding-left:0;}
    .nav{order:3; width:100%; margin:0; gap:20px;}
    .hud{top:calc(max(22px, env(safe-area-inset-top)) + 84px); right:var(--pad); font-size:.66rem;}
    .hud .hud-state{display:none;}
    body:not(.viewing) .hud{opacity:0;}
    .hero-foot{flex-direction:column; align-items:flex-start; gap:18px;}
    h1{font-size:clamp(2.8rem,16vw,6rem);}
    .panel{
      top:auto; left:0; width:auto; height:62vh; padding:64px var(--pad) 0;
      background:linear-gradient(180deg, transparent, rgba(5,6,7,.94) 50px, var(--bg) 40%);
      transform:translateY(24px);
    }
    .p-head{padding-bottom:16px;}
    .p-ip{margin-bottom:14px;}
    .p-body{padding-bottom:80px;}
    .rows > div{grid-template-columns:1fr; gap:4px;}
    .dock{left:50%; transform:translateX(-50%);}
    .panel::after{content:""; position:absolute; left:0; right:0; bottom:0; height:96px; pointer-events:none; background:linear-gradient(180deg, rgba(5,6,7,0), var(--bg) 70%);}
    .dock button{background:var(--bg);}
  }

  /* ---------- version texte (sans 3D) ---------- */
  body.flat{overflow:auto; overscroll-behavior:auto;}
  body.flat #scene, body.flat .shade, body.flat .labels, body.flat .dock, body.flat .close, body.flat .nav, body.flat .enter{display:none;}
  body.flat .top{position:sticky; background:var(--bg); padding-bottom:18px; border-bottom:1px solid var(--line);}
  body.flat .mode{margin-left:auto; border:0;}
  body.flat .hero, body.flat .panel{
    position:static; opacity:1; visibility:visible; transform:none; height:auto; background:none;
    width:min(820px, calc(100% - 2*var(--pad))); margin:0 auto; padding:70px 0 0;
  }
  body.flat .hero{padding-top:90px;}
  body.flat h1{font-size:clamp(2.8rem,9vw,6.6rem);}
  body.flat .p-body{overflow:visible; padding-bottom:0;}
  body.flat footer{display:block; width:min(820px, calc(100% - 2*var(--pad))); margin:80px auto 0; padding:22px 0 50px; border-top:1px solid var(--line); color:var(--mute);}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important; transition-duration:.01ms !important;}
    #loader pre span{opacity:1;}
  }
</style>
</head>

<canvas id="scene" aria-label="Réseau interactif : chaque équipement est une rubrique"></canvas>
<div class="shade" aria-hidden="true"></div>

<header class="top">
  <button class="brand" id="brand"></button>
  <nav class="nav" id="nav" aria-label="Rubriques"></nav>

</header>

<div class="hud mono" id="hud" aria-hidden="true">

<script>
/* Charge le contenu puis lance le site. En aperçu (admin), on lit le brouillon local. */
(function(){
  var preview = /[?&]preview=1/.test(location.search), draft = null;
  if (preview){ try{ draft = JSON.parse(localStorage.getItem('fabrice:preview') || 'null'); }catch(e){} }
  if (draft){ window.PORTFOLIO = draft; window.addEventListener('DOMContentLoaded', function(){ window.__run(); }); return; }
  var sc = document.createElement('script');
  sc.src = 'content.js?v=' + Date.now();          // jamais de version en cache après une publication
  sc.onload = sc.onerror = function(){ window.__run(); };
  document.head.appendChild(sc);
})();
</script>
<script>
window.__run = function(){
'use strict';

/* ================= DONNÉES (content.js) ================= */
var DATA = window.PORTFOLIO || {site:{}, sections:[]};
var PREVIEW = /[?&]preview=1/.test(location.search);
var SITE = DATA.site || {};
var $ = function(s){ return document.querySelector(s); };
var body = document.body;
var T0 = performance.now();
var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function rich(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>'); }
function paras(t){ return String(t || '').split(/\n\s*\n/).filter(function(x){ return x.trim(); }).map(function(x){ return '<p>' + rich(x.trim()) + '</p>'; }).join(''); }
function safeUrl(u){
  u = String(u || '').trim(); if (!u) return '';
  if (/^(https?:|mailto:|tel:)/i.test(u)) return u;
  if (/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(u)) return 'mailto:' + u;
  if (/^[+\d][\d\s.-]{5,}$/.test(u)) return 'tel:' + u.replace(/[\s.-]/g, '');
  if (/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(u)) return 'https://' + u;
  return '';
}
function linkAttrs(u){ return /^https?:/i.test(u) ? ' target="_blank" rel="noopener"' : ''; }
function color(c, d){ return /^#[0-9a-f]{6}$/i.test(c || '') ? c : d; }
function pad(n){ return (n < 10 ? '0' : '') + n; }

var BLOCK = {
  text: function(b){ return paras(b.text); },
  quote: function(b){ return '<blockquote>' + rich(b.text) + '</blockquote>'; },
  subtitle: function(b){ return '<p class="sub">' + esc(b.text) + '</p>'; },
  rows: function(b){ return '<dl class="rows">' + (b.items || []).map(function(it){ return '<div><dt>' + esc(it.label) + '</dt><dd>' + rich(it.text) + '</dd></div>'; }).join('') + '</dl>'; },
  projects: function(b){ return (b.items || []).map(function(it){
    var u = safeUrl(it.url), name = u ? '<a href="' + esc(u) + '"' + linkAttrs(u) + '>' + esc(it.name) + '</a>' : esc(it.name);
    return '<div class="proj"><header><h3>' + name + '</h3>' + (it.status ? '<span class="mono' + (it.live ? ' live' : '') + '">' + esc(it.status) + '</span>' : '') + '</header>' +
      (it.text ? '<p>' + rich(it.text) + '</p>' : '') + (it.stack ? '<small>' + esc(it.stack) + '</small>' : '') + '</div>';
  }).join(''); },
  list: function(b){ return '<ul class="goals">' + (b.items || []).map(function(it){ return '<li><p>' + rich(it.text) + '</p></li>'; }).join('') + '</ul>'; },
  bars: function(b){ return (b.items || []).map(function(it){ var v = Math.max(0, Math.min(100, +it.value || 0)); return '<div class="bar"><span>' + esc(it.label) + '</span><i style="--w:' + v + '%"></i><em>' + v + '%</em></div>'; }).join(''); },
  links: function(b){ return '<div class="links">' + (b.items || []).map(function(it){ var u = safeUrl(it.url); return u ? '<a href="' + esc(u) + '"' + linkAttrs(u) + '>' + esc(it.label || u.replace(/^mailto:|^tel:|^https?:\/\//, '')) + '</a>' : ''; }).join('') + '</div>'; }
};

// textes du site
document.title = SITE.title || SITE.logo || 'Portfolio';
var metaDesc = document.querySelector('meta[name="description"]'); if (metaDesc && SITE.description) metaDesc.content = SITE.description;
$('#brand').textContent = SITE.logo || '';
$('#tagline').textContent = SITE.tagline || '';
$('#name').innerHTML = '<span><b>' + esc(SITE.nameLine1) + '</b></span><span><b>' + esc(SITE.nameLine2) + '</b></span>';
$('#intro').textContent = SITE.intro || '';

// une section = un panneau + un équipement du réseau, dans son propre VLAN
var DEVICES = ['pc','router','server','switch','wifi','cloud','firewall'];
var PALETTE = ['#5eead4','#7dd3fc','#a5b4fc','#fcd34d','#f9a8d4','#86efac','#fdba74','#c4b5fd','#67e8f9','#fca5a5'];
var usedIds = {}, usedVlan = {};
var SECTIONS = (DATA.sections || []).map(function(sec, i){
  var id = String(sec.id || sec.label || 'section').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section';
  while (usedIds[id] || document.getElementById(id)) id += '-' + (i+1);
  usedIds[id] = 1;
  var vlan = Math.round(+sec.vlan) || (i+1)*10;
  vlan = Math.max(1, Math.min(254, vlan));
  while (usedVlan[vlan]) vlan = vlan % 254 + 1;
  usedVlan[vlan] = 1;
  return {
    id:id, label:sec.label || 'Section', heading:sec.heading || '', blocks:sec.blocks || [],
    c:color(sec.color, PALETTE[i % PALETTE.length]),
    device:DEVICES.indexOf(sec.device) >= 0 ? sec.device : DEVICES[i % DEVICES.length],
    hosts:Math.max(0, Math.min(6, sec.hosts == null ? 3 : (+sec.hosts || 0))),
    vlan:vlan
  };
});
function subnet(s){ return '192.168.' + s.vlan + '.0/24'; }

var panels = {}, main = $('#main');
SECTIONS.forEach(function(s, i){
  var el = document.createElement('article');
  el.className = 'panel'; el.id = s.id; el.style.setProperty('--c', s.c);
  el.innerHTML = '<div class="p-head"><div class="p-row"><span class="mono">VLAN ' + s.vlan + ' / ' + esc(s.label) + '</span><button class="close" aria-label="Fermer"></button></div>' +
    '<p class="p-ip mono">' + subnet(s) + '</p>' +
    '<h2>' + esc(s.heading) + '</h2></div><div class="p-body">' +
    (s.blocks.map(function(b){ return BLOCK[b.type] ? BLOCK[b.type](b) : ''; }).join('') || '<p class="empty">Section vide pour l\'instant.</p>') + '</div>';
  main.appendChild(el); panels[s.id] = el;
});
if (!SECTIONS.length) $('#start').style.display = 'none';

var current = -1;            // rubrique ouverte (-1 = aucune)
var api = null;              // rempli par la scène 3D si elle démarre

function setUI(i){
  var prev = current;
  current = i; body.classList.toggle('viewing', i >= 0);
  SECTIONS.forEach(function(s, k){
    panels[s.id].classList.toggle('open', k === i);
    navBtns[k].classList.toggle('on', k === i);
  });
  if (i >= 0){
    body.classList.remove('home');
    body.style.setProperty('--c', SECTIONS[i].c);
    where.textContent = pad(i+1) + ' / ' + pad(SECTIONS.length);
    navBtns[i].scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
    try{ history.replaceState(null, '', '#' + SECTIONS[i].id); }catch(e){}
    if (prev !== i && window.__scramble) window.__scramble(panels[SECTIONS[i].id].querySelector('h2'), 250);
  } else {
    body.style.removeProperty('--c');
    where.textContent = '—';
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  }
}
function focus(i){
  if (body.classList.contains('flat')){ panels[SECTIONS[i].id].scrollIntoView({behavior:'smooth'}); return; }
  var from = current;
  setUI(i); if (api) api.focus(i, from);
}
function overview(home){
  setUI(-1); body.classList.toggle('home', !!home); if (api) api.overview();
}
function step(d){
  var n = SECTIONS.length; if (!n) return;
  focus(current < 0 ? (d > 0 ? 0 : n-1) : (current + d + n) % n);
}
$('#start').addEventListener('click', function(){ if (SECTIONS.length) focus(0); });
$('#brand').addEventListener('click', function(){
  if (body.classList.contains('flat')) window.scrollTo({top:0, behavior:'smooth'}); else overview(true);
});
$('#prev').addEventListener('click', function(){ step(-1); });
$('#next').addEventListener('click', function(){ step(1); });
document.querySelectorAll('.close').forEach(function(b){ b.addEventListener('click', function(){ overview(false); }); });

function setFlat(on){
  body.classList.toggle('flat', on);
  modeBtn.textContent = on ? '3D' : 'Texte';
  if (on){ setUI(-1); body.classList.add('home'); }
  if (api) api.run(!on);
  if (!on){ window.scrollTo(0,0); overview(true); }
}
modeBtn.addEventListener('click', function(){ setFlat(!body.classList.contains('flat')); });

/* ================= TEXTE CHIFFRÉ =================
   Au survol (et à l'ouverture d'un panneau), une vague de caractères
   « chiffrés » balaie le texte de gauche à droite, puis il se déchiffre. */
(function(){
  if (REDUCED) return;
  var GLYPHS = '01<>/\\_=+*#%&$ABCDEF';
  function scramble(el, delay){
    if (!el || el._scr) return;
    var nodes = [], total = 0;
    (function walk(n){
      n.childNodes.forEach(function(c){
        if (c.nodeType === 3 && c.nodeValue.trim()){ nodes.push({n:c, o:c.nodeValue, at:total}); total += c.nodeValue.length; }
        else if (c.nodeType === 1) walk(c);
      });
    })(el);
    if (!total) return;
    if (!el.hasAttribute('aria-label') && !/^(BUTTON|A)$/.test(el.tagName)) el.setAttribute('aria-label', el.textContent.replace(/\s+/g, ' ').trim());
    el._scr = true;
    var dur = Math.min(900, 320 + total * 16), W = .32, start = performance.now() + (delay || 0);
    function frame(now){
      var p = (now - start) / dur * (1 + W);
      if (p < 0){ requestAnimationFrame(frame); return; }
      var done = p >= 1 + W;
      nodes.forEach(function(x){
        if (done){ x.n.nodeValue = x.o; return; }
        var out = '';
        for (var k = 0; k < x.o.length; k++){
          var ch = x.o[k], pos = (x.at + k) / total;
          out += (ch !== ' ' && pos < p && pos > p - W) ? GLYPHS[(Math.random() * GLYPHS.length) | 0] : ch;
        }
        x.n.nodeValue = out;
      });
      if (done) el._scr = false; else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  window.__scramble = scramble;
  var hoverable = matchMedia('(hover:hover)').matches;
  if (!hoverable) return;
  document.addEventListener('pointerover', function(e){
    var el = e.target.closest && e.target.closest('h1, h2, .proj h3, .links a, .nav button, .brand, .enter, .label');
    if (!el || (e.relatedTarget && el.contains(e.relatedTarget))) return;
    scramble(el);
  });
})();

/* ================= DÉMARRAGE ================= */
var booted = false;
window.__boot = function(){
  if (booted) return; booted = true;
  var ok = false;
  try{ ok = !!window.THREE && initScene(); }catch(e){ console.error(e); ok = false; }
  if (!ok){ setFlat(true); modeBtn.style.display = 'none'; }
  else if (REDUCED){ setFlat(true); }
  else {
    var h = location.hash.slice(1);
    var idx = SECTIONS.findIndex(function(s){ return s.id === h; });
    if (idx >= 0) setTimeout(function(){ focus(idx); }, PREVIEW ? 150 : 1700);
  }
  // le ping du chargement a le temps de se terminer
  var wait = PREVIEW || REDUCED ? 0 : Math.max(0, 1600 - (performance.now() - T0));
  setTimeout(function(){
    $('#loader').classList.add('done');
    setTimeout(function(){ body.classList.add('ready'); }, 350);
    setTimeout(function(){ body.classList.add('revealed'); }, 2300);
  }, wait);
};

/* ================= SCÈNE 3D : LE RÉSEAU ================= */
function initScene(){
  var THREE = window.THREE;
  var canvas = $('#scene');
  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x050607, 1);

  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050607, .0065);
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
  var W = 1, H = 1;
  var small = Math.min(window.innerWidth, window.innerHeight) < 700;
  var ACCENT = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#5eead4';

  function vec3(hex){ var n = parseInt(hex.slice(1),16); return new THREE.Vector3((n>>16&255)/255,(n>>8&255)/255,(n&255)/255); }

  /* ---- textures ---- */
  function glowTexture(stops){
    var c = document.createElement('canvas'); c.width = c.height = 64;
    var g = c.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,32);
    stops.forEach(function(s){ gr.addColorStop(s[0], s[1]); });
    g.fillStyle = gr; g.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  }
  var texGlow = glowTexture([[0,'rgba(255,255,255,1)'],[.2,'rgba(255,255,255,.7)'],[.5,'rgba(255,255,255,.12)'],[1,'rgba(255,255,255,0)']]);
  function glow(col, scale, opacity){
    var s = new THREE.Sprite(new THREE.SpriteMaterial({map:texGlow, color:col, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, opacity:opacity, fog:false}));
    s.scale.setScalar(scale); return s;
  }

  /* ---- lumières ---- */
  scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x050607, .7));
  var key = new THREE.DirectionalLight(0xffffff, .9); key.position.set(30, 60, 20); scene.add(key);
  var coreLight = new THREE.PointLight(new THREE.Color(ACCENT), 30, 40, 1.6); coreLight.position.set(0, 4, 0); scene.add(coreLight);

  /* ---- sol : grille de topologie + onde de ping ---- */
  var gridU = {uTime:{value:0}, uCol:{value:vec3(ACCENT)}};
  var grid = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.ShaderMaterial({
    uniforms:gridU, transparent:true, depthWrite:false,
    vertexShader:'varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }',
    fragmentShader:[
      'precision highp float; uniform float uTime; uniform vec3 uCol; varying vec3 vW;',
      'float gridLine(vec2 p){ vec2 g=abs(fract(p-.5)-.5)/fwidth(p); return 1.0-min(min(g.x,g.y),1.0); }',
      'void main(){',
      ' vec2 p=vW.xz; float d=length(p);',
      ' float l1=gridLine(p/2.0), l2=gridLine(p/10.0);',
      ' float fade=smoothstep(170.0,8.0,d);',
      ' float w=mod(uTime*16.0,200.0);',
      ' float ring=exp(-pow(d-w,2.0)*.05)*smoothstep(170.0,10.0,w);',
      ' float dots=step(length(fract(p/10.0+.5)-.5),.012);',
      ' float a=(l1*.045+l2*.11+dots*.25)*fade + ring*(l1*.35+l2*.6+.05)*fade;',
      ' gl_FragColor=vec4(mix(vec3(1.0),uCol,clamp(ring*1.4,0.0,1.0)),a);',
      '}'
    ].join('\n')
  }));
  grid.rotation.x = -Math.PI/2; scene.add(grid);

  /* ---- poussière de données ---- */
  (function(){
    var n = small ? 260 : 600, pos = new Float32Array(n*3);
    for (var i=0;i<n;i++){
      var a = Math.random()*Math.PI*2, r = 8 + Math.pow(Math.random(), .7)*130;
      pos[i*3] = Math.cos(a)*r; pos[i*3+1] = 1 + Math.random()*Math.random()*40; pos[i*3+2] = Math.sin(a)*r;
    }
    var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    var pts = new THREE.Points(g, new THREE.PointsMaterial({size:.22, map:texGlow, color:0xcfd8df, transparent:true, opacity:.5, depthWrite:false, blending:THREE.AdditiveBlending}));
    scene.add(pts);
  })();

  /* ---- fabrique d'équipements : volumes sombres + arêtes fines ---- */
  var BODY = new THREE.MeshStandardMaterial({color:0x0b0e12, roughness:.5, metalness:.55, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1});
  function part(group, geo, edgeMat, x, y, z, fill){
    var m = new THREE.Mesh(geo, fill || BODY); m.position.set(x, y, z); group.add(m);
    var e = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), edgeMat); e.position.copy(m.position); group.add(e);
    return m;
  }
  function arrow(arr, cx, cz, ang, len, y, head){
    var ex = cx + Math.cos(ang)*len, ez = cz + Math.sin(ang)*len, hl = head || len*.38;
    arr.push(cx,y,cz, ex,y,ez);
    [ang + Math.PI*.8, ang - Math.PI*.8].forEach(function(a){ arr.push(ex,y,ez, ex + Math.cos(a)*hl, y, ez + Math.sin(a)*hl); });
  }
  function segs(group, arr, mat){
    var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
    var l = new THREE.LineSegments(g, mat); group.add(l); return l;
  }
  function led(group, col, x, y, z, s){
    var g = glow(col, s || .45, .9); g.position.set(x, y, z); group.add(g);
    return {sprite:g, phase:Math.random()*10, rate:2 + Math.random()*6};
  }

  // chaque modèle a sa face avant vers +z (tournée vers l'extérieur du réseau)
  function buildDevice(type, col, big){
    var g = new THREE.Group(), leds = [], screen = null;
    var edge = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:.55});
    var acc  = new THREE.LineBasicMaterial({color:new THREE.Color(col), transparent:true, opacity:.9});
    var k = big ? 1.7 : 1, i;
    if (type === 'router'){
      var r = 1.5*k, h = 1*k;
      part(g, new THREE.CylinderGeometry(r, r, h, 48), edge, 0, 0, 0);
      var a = [];
      for (i=0;i<4;i++){
        var an = Math.PI/4 + i*Math.PI/2, ca = Math.cos(an), sa = Math.sin(an);
        if (i % 2) arrow(a, ca*r*.18, sa*r*.18, an, r*.6, h/2 + .02);
        else arrow(a, ca*r*.86, sa*r*.86, an + Math.PI, r*.6, h/2 + .02);
      }
      segs(g, a, acc);
      for (i=0;i<6;i++){ var la = i/6*Math.PI*2; leds.push(led(g, col, Math.sin(la)*r*1.01, -h*.15, Math.cos(la)*r*1.01, .35*k)); }
    }
    else if (type === 'switch'){
      part(g, new THREE.BoxGeometry(3.8, .8, 2.2), edge, 0, 0, 0);
      var b = [];
      arrow(b, -1.1, -.66, 0, 2.2, .42, .26); arrow(b, 1.1, -.22, Math.PI, 2.2, .42, .26);
      arrow(b, -1.1, .22, 0, 2.2, .42, .26); arrow(b, 1.1, .66, Math.PI, 2.2, .42, .26);
      segs(g, b, acc);
      for (i=0;i<10;i++) leds.push(led(g, col, -1.55 + i*.345, .05, 1.11, .28));
    }
    else if (type === 'server'){
      part(g, new THREE.BoxGeometry(1.8, 3.4, 1.8), edge, 0, .9, 0);
      var c2 = [];
      for (i=0;i<5;i++){ var y = -.5 + i*.62; c2.push(-.7, y, .91, .45, y, .91); }
      segs(g, c2, acc);
      for (i=0;i<5;i++) leds.push(led(g, col, .66, -.5 + i*.62, .92, .26));
    }
    else if (type === 'pc'){
      part(g, new THREE.BoxGeometry(3.2, 2.1, .18), edge, 0, 1.3, 0);
      part(g, new THREE.BoxGeometry(.22, .8, .22), edge, 0, -.1, -.05);
      part(g, new THREE.BoxGeometry(1.4, .1, .8), edge, 0, -.5, 0);
      screen = new THREE.ShaderMaterial({
        uniforms:{uCol:{value:vec3(col)}, uTime:{value:0}, uHot:{value:0}},
        vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
        fragmentShader:[
          'precision highp float; varying vec2 vUv; uniform vec3 uCol; uniform float uTime; uniform float uHot;',
          'float h(float n){ return fract(sin(n)*43758.5453); }',
          'void main(){',
          ' float row=floor(vUv.y*9.0); float f=fract(vUv.y*9.0);',
          ' float len=.12+h(row*7.1+floor(uTime*.8+row*.37))*.7;',
          ' float on=step(.08,vUv.x)*step(vUv.x,len)*step(.3,f)*step(f,.72);',
          ' float cur=step(.08,vUv.x-len)*step(vUv.x-len,.12)*step(.3,f)*step(f,.72)*step(.5,fract(uTime*1.5))*step(row,0.5);',
          ' float scan=.88+.12*sin(vUv.y*220.0);',
          ' vec3 c=uCol*((on*.75+cur)+.05)*scan*(.7+.5*uHot);',
          ' gl_FragColor=vec4(c,1.0);',
          '}'
        ].join('\n')
      });
      var sc = new THREE.Mesh(new THREE.PlaneGeometry(2.9, 1.8), screen);
      sc.position.set(0, 1.3, .1); g.add(sc);
      leds.push(led(g, col, 1.45, .33, .1, .22));
    }
    else if (type === 'wifi'){
      part(g, new THREE.BoxGeometry(2.2, .45, 1.4), edge, 0, 0, 0);
      [-.75, .75].forEach(function(x){ part(g, new THREE.CylinderGeometry(.06, .06, 1.5, 8), edge, x, .95, -.45); });
      var w = [];
      [.6, 1.05, 1.5].forEach(function(r){
        for (var a2=0; a2<16; a2++){
          var a0 = Math.PI*.2 + a2/16*Math.PI*.6, a1 = Math.PI*.2 + (a2+1)/16*Math.PI*.6;
          w.push(Math.cos(a0)*r, .4 + Math.sin(a0)*r, .1, Math.cos(a1)*r, .4 + Math.sin(a1)*r, .1);
        }
      });
      segs(g, w, acc);
      for (i=0;i<3;i++) leds.push(led(g, col, -.5 + i*.5, 0, .71, .26));
    }
    else if (type === 'cloud'){
      [[0,0,0,1.25],[-1.3,-.25,.1,.9],[1.3,-.2,-.1,.95],[-.55,.55,-.3,.85],[.6,.6,.25,.8]].forEach(function(c){
        var geo = new THREE.IcosahedronGeometry(c[3]*k, 1);
        var m = new THREE.Mesh(geo, BODY); m.position.set(c[0]*k, c[1]*k + .4, c[2]*k); g.add(m);
        var w = new THREE.LineSegments(new THREE.WireframeGeometry(geo), acc.clone()); w.material.opacity = .35;
        w.position.copy(m.position); g.add(w);
      });
      leds.push(led(g, col, 0, .5, 0, 3.2)); leds[0].big = true;
    }
    else { // firewall : un mur de briques
      for (var row=0; row<4; row++) for (var col2=0; col2<4; col2++){
        var off = row % 2 ? .45 : 0, x = -1.35 + col2*.9 + off;
        if (x > 1.4) continue;
        part(g, new THREE.BoxGeometry(.84, .5, .9), edge, x, row*.56 - .5, 0);
      }
      leds.push(led(g, col, 0, .4, .6, 2.4)); leds[0].big = true;
    }
    return {group:g, edge:edge, acc:acc, leds:leds, screen:screen};
  }

  /* ---- routeur central : R1 ---- */
  var core = buildDevice('router', ACCENT, true);
  core.group.position.y = 2.2; scene.add(core.group);
  var coreHalo = glow(ACCENT, 9, .35); coreHalo.position.y = .2; scene.add(coreHalo);
  var corePick = new THREE.Mesh(new THREE.SphereGeometry(4, 12, 12), new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false}));
  corePick.position.y = 2.2; corePick.userData.index = -1; scene.add(corePick);
  function floorRing(rIn, rOut, col, op){
    var m = new THREE.Mesh(new THREE.RingGeometry(rIn, rOut, 72), new THREE.MeshBasicMaterial({color:new THREE.Color(col), transparent:true, opacity:op, depthWrite:false, side:THREE.DoubleSide}));
    m.rotation.x = -Math.PI/2; m.position.y = .02; return m;
  }
  var coreRing = floorRing(3.6, 3.7, ACCENT, .5); scene.add(coreRing);
  scene.add(floorRing(4.4, 4.43, '#ffffff', .15));

  /* ---- équipements des sections, répartis autour du routeur ---- */
  var N = SECTIONS.length;
  var RADIUS = 20 + N*1.6;
  var nodes = [], pickables = [corePick], cables = [];
  var lineMat = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:.2});

  function cableCurve(a, b, bend){
    var dir = new THREE.Vector3().subVectors(b, a); dir.y = 0;
    var len = dir.length(); dir.normalize();
    var side = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(len*bend);
    var p1 = a.clone().addScaledVector(dir, len*.33).add(side); p1.y = .08;
    var p2 = b.clone().addScaledVector(dir, -len*.33).sub(side); p2.y = .08;
    return new THREE.CubicBezierCurve3(a, p1, p2, b);
  }
  function addLine(curve, mat, n){
    var l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(n || 60)), mat);
    scene.add(l); return l;
  }

  SECTIONS.forEach(function(s, i){
    var ang = -Math.PI/2 + i/N*Math.PI*2 + .35;
    var rad = RADIUS + (i % 2 ? 4 : -1);
    var base = new THREE.Vector3(Math.cos(ang)*rad, 0, Math.sin(ang)*rad);
    var face = Math.atan2(base.x, base.z);

    var dev = buildDevice(s.device, s.c, false);
    var holder = new THREE.Group(); holder.position.copy(base); holder.rotation.y = face; scene.add(holder);
    holder.add(dev.group); dev.group.position.y = 2.4;

    // socle au sol + fil vertical
    var ring = floorRing(2.7, 2.8, s.c, .45); ring.position.set(base.x, .02, base.z); scene.add(ring);
    var drop = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,.05,0), new THREE.Vector3(0,1.4,0)]),
      new THREE.LineDashedMaterial({color:new THREE.Color(s.c), dashSize:.12, gapSize:.12, transparent:true, opacity:.5}));
    drop.computeLineDistances(); holder.add(drop);
    var halo = glow(s.c, 6, .18); halo.position.set(base.x, .2, base.z); scene.add(halo);

    // câble vers le routeur
    var from = new THREE.Vector3(Math.cos(ang)*3.7, .05, Math.sin(ang)*3.7);
    var to = new THREE.Vector3(base.x - Math.cos(ang)*2.8, .05, base.z - Math.sin(ang)*2.8);
    var curve = cableCurve(from, to, (i % 2 ? .1 : -.1));
    var cMat = lineMat.clone();
    var cable = addLine(curve, cMat);
    cables.push({curve:curve, mat:cMat, node:i});

    // postes clients rattachés à l'équipement
    var hosts = [];
    for (var h=0; h<s.hosts; h++){
      var ha = ang + (h - (s.hosts-1)/2) * .5 / Math.max(1, rad/24);
      var hr = rad + 7 + (h % 2) * 2.2;
      var hp = new THREE.Vector3(Math.cos(ha)*hr, .35, Math.sin(ha)*hr);
      var hg = new THREE.Group(); hg.position.copy(hp); hg.rotation.y = Math.atan2(hp.x, hp.z); scene.add(hg);
      var he = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:.3});
      part(hg, new THREE.BoxGeometry(.9, .6, .6), he, 0, 0, 0);
      var hl = led(hg, s.c, .3, .05, .31, .2);
      var hc = cableCurve(new THREE.Vector3(base.x + Math.cos(ha)*2.8, .05, base.z + Math.sin(ha)*2.8), new THREE.Vector3(hp.x, .05, hp.z), 0);
      var hm = lineMat.clone(); hm.opacity = .1; addLine(hc, hm, 12);
      cables.push({curve:hc, mat:hm, node:i, host:true});
      hosts.push({led:hl, edge:he});
    }

    var pick = new THREE.Mesh(new THREE.SphereGeometry(3.6, 12, 12), new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false}));
    pick.position.set(base.x, 2.6, base.z); pick.userData.index = i; scene.add(pick); pickables.push(pick);

    nodes.push({s:s, i:i, base:base, holder:holder, dev:dev, ring:ring, halo:halo, curve:curve, hosts:hosts, hot:0, pos:new THREE.Vector3(base.x, 2.6, base.z)});
  });
  var OUTER = RADIUS + 13;

  /* ---- paquets qui circulent en permanence ---- */
  var packets = [], pCount = 0, hudCount = $('#hud-count');
  cables.forEach(function(c){
    var n = c.host ? 1 : 2;
    for (var k=0; k<n; k++){
      var col = Math.random() < .5 ? '#ffffff' : SECTIONS[c.node].c;
      var sp = glow(col, c.host ? .45 : .7, .95); scene.add(sp);
      packets.push({c:c, s:sp, t:Math.random(), v:(c.host ? .35 : .18) + Math.random()*.15, dir:Math.random() < .5 ? 1 : -1});
    }
  });

  /* ---- le paquet de navigation : routage inter-VLAN via R1 ---- */
  var trailN = 14, trail = [];
  var probe = glow('#ffffff', 2.2, 0); scene.add(probe);
  for (var q=0; q<trailN; q++){ var ts = glow('#ffffff', 1.4*(1 - q/trailN), 0); scene.add(ts); trail.push(ts); }
  var hist = [];
  var travel = null;   // {legs:[{curve, a, b}], leg, t, to, col}

  function routeText(from, to){
    var a = from >= 0 ? 'VLAN ' + SECTIONS[from].vlan : 'internet';
    return a + ' → R1 → VLAN ' + SECTIONS[to].vlan;
  }

  /* ---- caméra : orbite amortie ---- */
  var cur  = {t:new THREE.Vector3(0,0,0), r:PREVIEW ? 120 : 420, th:-2.4, ph:.25, ox:0, oy:0};
  var goal = {t:new THREE.Vector3(0,0,0), r:80,  th:.6,  ph:.95, ox:0, oy:0};
  var focused = -1, lastInput = 0;
  var PH_MIN = .12, PH_MAX = 1.42, R_MIN = 6, R_MAX = 260;

  function mobile(){ return W <= 820; }
  function overviewRadius(){ return 64 * Math.max(1, (OUTER + 10) / 52) * Math.max(1, 1.2 / (W/H)); }
  function setOffsets(){
    var f = focused >= 0 ? focused : (travel ? travel.to : -1);
    if (f >= 0){
      if (mobile()){ goal.ox = 0; goal.oy = H*.27; }
      else { var pw = panels[SECTIONS[f].id].offsetWidth || 480; goal.ox = (pw - 40)/2; goal.oy = 0; }
    } else if (body.classList.contains('home')){
      if (mobile()){ goal.ox = 0; goal.oy = H*.2; } else { goal.ox = -W*.04; goal.oy = H*.12; }
    } else { goal.ox = 0; goal.oy = 0; }
  }
  function nearestAngle(target, from){
    var d = (target - from) % (Math.PI*2);
    if (d > Math.PI) d -= Math.PI*2; if (d < -Math.PI) d += Math.PI*2;
    return from + d;
  }
  function settleOn(i){
    focused = i;
    var p = nodes[i].base;
    goal.t.copy(nodes[i].pos);
    goal.r = mobile() ? 20 : 16;
    goal.ph = 1.18;
    goal.th = nearestAngle(Math.atan2(p.x, p.z) + .55, cur.th);
    setOffsets();
  }
  function focusNode(i, from){
    if (from === i || REDUCED){ travel = null; settleOn(i); return; }
    var legs = [];
    if (from >= 0) legs.push({curve:nodes[from].curve, a:1, b:0});
    else legs.push({curve:new THREE.LineCurve3(new THREE.Vector3(0, 40, 0), new THREE.Vector3(0, 2.2, 0)), a:0, b:1});
    legs.push({curve:nodes[i].curve, a:0, b:1});
    travel = {legs:legs, leg:0, t:0, to:i};
    hist.length = 0;
    probe.material.color.set(SECTIONS[i].c);
    trail.forEach(function(s){ s.material.color.set(SECTIONS[i].c); });
    hudRoute.textContent = routeText(from, i); hudRoute.classList.add('live');
    focused = -1;
    goal.r = mobile() ? 34 : 28; goal.ph = 1.0;
    setOffsets();
  }
  function goOverview(){
    focused = -1; travel = null;
    goal.t.set(0,0,0); goal.r = overviewRadius(); goal.ph = .95;
    lastInput = 0; setOffsets();
    hudRoute.classList.remove('live');
  }
  function release(){
    if (focused >= 0 || travel || body.classList.contains('home')){
      focused = -1; travel = null; setUI(-1); body.classList.remove('home'); setOffsets();
    }
  }
  function touched(){ lastInput = performance.now(); }

  /* ---- interactions ---- */
  var pointers = {}, nPointers = 0, dragDist = 0, pinch = 0, downAt = null;
  var ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), hoverIdx = -2, mouseDirty = false, mouseXY = [0,0];

  function pickAt(x, y){
    mouse.set(x/W*2 - 1, -(y/H*2 - 1));
    ray.setFromCamera(mouse, camera);
    var hit = ray.intersectObjects(pickables, false)[0];
    return hit ? hit.object.userData.index : -2;
  }
  function pinchDist(){
    var k = Object.keys(pointers); if (k.length < 2) return 0;
    var a = pointers[k[0]], b2 = pointers[k[1]];
    return Math.hypot(a[0]-b2[0], a[1]-b2[1]);
  }
  canvas.addEventListener('pointerdown', function(e){
    canvas.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = [e.clientX, e.clientY]; nPointers++;
    if (nPointers === 1){ dragDist = 0; downAt = [e.clientX, e.clientY]; }
    if (nPointers === 2){ pinch = pinchDist(); dragDist = 99; }
    canvas.classList.add('dragging'); lastInput = performance.now();
  });
  canvas.addEventListener('pointermove', function(e){
    mouseXY = [e.clientX, e.clientY]; mouseDirty = e.pointerType === 'mouse';
    var p = pointers[e.pointerId]; if (!p) return;
    var dx = e.clientX - p[0], dy = e.clientY - p[1];
    p[0] = e.clientX; p[1] = e.clientY;
    if (nPointers === 1){
      dragDist += Math.abs(dx) + Math.abs(dy);
      goal.th -= dx * .0055;
      goal.ph = Math.min(PH_MAX, Math.max(PH_MIN, goal.ph - dy * .0045));
      if (dragDist > 8) touched();
    } else if (nPointers === 2){
      var d = pinchDist();
      if (pinch > 0 && d > 0) goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r * pinch / d));
      pinch = d; touched();
    }
  });
  function up(e){
    if (!pointers[e.pointerId]) return;
    delete pointers[e.pointerId]; nPointers--;
    if (nPointers <= 0){
      nPointers = 0; canvas.classList.remove('dragging');
      if (e.type === 'pointerup' && dragDist < 8 && downAt){
        var idx = pickAt(e.clientX, e.clientY);
        if (idx >= 0) focus(idx);
        else if (idx === -1) overview(true);
      }
    }
  }
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    var d = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
    goal.r = Math.min(R_MAX, Math.max(R_MIN, goal.r * Math.exp(d * .0012)));
    touched();
  }, {passive:false});

  var keys = {};
  var MOVE = {ArrowUp:'f', KeyW:'f', ArrowDown:'b', KeyS:'b', ArrowLeft:'l', KeyA:'l', ArrowRight:'r', KeyD:'r'};
  window.addEventListener('keydown', function(e){
    if (body.classList.contains('flat') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (e.code === 'Escape'){ if (current >= 0) overview(false); return; }
    if (MOVE[e.code]){ keys[MOVE[e.code]] = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', function(e){ if (MOVE[e.code]) keys[MOVE[e.code]] = false; });
  window.addEventListener('blur', function(){ keys = {}; });

  /* ---- redimensionnement ---- */
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    renderer.setSize(W, H, false);
    camera.aspect = W/H; camera.updateProjectionMatrix();
    if (focused < 0 && !travel && !lastInput) goal.r = overviewRadius();
    setOffsets();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---- boucle ---- */
  var clock = new THREE.Clock(), running = true, raf = 0, t = 0;
  var v = new THREE.Vector3(), fwd = new THREE.Vector3(), right = new THREE.Vector3(), tmp = new THREE.Vector3();
  var focalK = 1 / (2 * Math.tan(camera.fov * Math.PI / 360));
  var white = new THREE.Color(0xffffff), corePulse = 0;
  function ease(x){ return x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2)/2; }

  function frame(){
    raf = requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), .05); t += dt;
    var now = performance.now();
    gridU.uTime.value = t;

    // routeur central
    corePulse = Math.max(0, corePulse - dt*1.5);
    core.group.rotation.y = t*.15;
    core.group.position.y = 2.2 + Math.sin(t*.8)*.12;
    coreHalo.material.opacity = .28 + Math.sin(t*1.3)*.06 + corePulse*.5;
    coreRing.scale.setScalar(1 + corePulse*.25);
    coreLight.intensity = 26 + corePulse*60;
    core.leds.forEach(function(l){ l.sprite.material.opacity = .4 + .6*(Math.sin(t*l.rate + l.phase) > .2 ? 1 : .15); });

    // équipements
    for (var i=0; i<nodes.length; i++){
      var n = nodes[i], hot = (i === hoverIdx || i === focused || (travel && travel.to === i)) ? 1 : 0;
      n.hot += (hot - n.hot) * Math.min(1, dt*6);
      n.dev.group.position.y = 2.4 + Math.sin(t*.9 + i*1.7)*.18;
      n.dev.group.rotation.y = Math.sin(t*.3 + i)*.12;
      n.dev.edge.opacity = .45 + n.hot*.5;
      n.dev.acc.opacity = .7 + n.hot*.3;
      n.ring.material.opacity = .28 + n.hot*.3;
      n.ring.scale.setScalar(1 + n.hot*.12 + Math.sin(t*2 + i)*.015);
      n.halo.material.opacity = .14 + n.hot*.22;
      if (n.dev.screen){ n.dev.screen.uniforms.uTime.value = t; n.dev.screen.uniforms.uHot.value = n.hot; }
      for (var l=0; l<n.dev.leds.length; l++){
        var ld = n.dev.leds[l];
        ld.sprite.material.opacity = ld.big ? (.12 + n.hot*.2 + Math.sin(t*1.2 + ld.phase)*.04) : (.25 + .75*(Math.sin(t*ld.rate + ld.phase) > -.1 ? 1 : 0)) * (.6 + .4*n.hot);
      }
      for (var hh=0; hh<n.hosts.length; hh++){
        var ho = n.hosts[hh];
        ho.led.sprite.material.opacity = Math.sin(t*ho.led.rate + ho.led.phase) > .3 ? .9 : .2;
        ho.edge.opacity = .25 + n.hot*.3;
      }
    }
    for (var c=0; c<cables.length; c++){
      var cb = cables[c], target = (cb.node === focused || cb.node === hoverIdx) ? (cb.host ? .3 : .55) : (cb.host ? .1 : .2);
      cb.mat.opacity += (target - cb.mat.opacity) * Math.min(1, dt*5);
    }

    // trafic permanent
    for (var p=0; p<packets.length; p++){
      var pk = packets[p];
      pk.t += pk.v * dt * pk.dir;
      if (pk.t > 1 || pk.t < 0){
        pk.t = pk.dir > 0 ? 0 : 1;
        if (!pk.c.host){ pCount++; if (pk.dir < 0) corePulse = Math.max(corePulse, .25); }
      }
      pk.c.curve.getPoint(pk.t, v); pk.s.position.set(v.x, v.y + .25, v.z);
      pk.s.material.opacity = Math.min(1, Math.min(pk.t, 1 - pk.t) * 8) * .9;
    }
    hudCount.textContent = pCount.toLocaleString('fr-FR');

    // paquet de navigation
    if (travel){
      var leg = travel.legs[travel.leg];
      var legDur = travel.leg === 0 && leg.a === 0 && leg.curve.isLineCurve3 ? .55 : .8;
      travel.t = Math.min(1, travel.t + dt / legDur);
      var u = leg.a + (leg.b - leg.a) * ease(travel.t);
      leg.curve.getPoint(u, v); v.y += .5;
      probe.position.copy(v); probe.material.opacity = 1;
      hist.unshift(v.clone()); if (hist.length > trailN*2) hist.length = trailN*2;
      goal.t.lerp(v, .25);
      if (travel.t >= 1){
        if (travel.leg < travel.legs.length - 1){ travel.leg++; travel.t = 0; corePulse = 1; }
        else { var dest = travel.to; travel = null; corePulse = Math.max(corePulse, .4); settleOn(dest); setTimeout(function(){ hudRoute.classList.remove('live'); }, 1400); }
      }
    } else {
      probe.material.opacity *= .85;
      if (hist.length) hist.pop();
    }
    for (var tr=0; tr<trailN; tr++){
      var hp = hist[tr*2];
      if (hp){ trail[tr].position.copy(hp); trail[tr].material.opacity = (1 - tr/trailN) * .7; }
      else trail[tr].material.opacity = 0;
    }

    // déplacement clavier
    var mx = (keys.r?1:0) - (keys.l?1:0), mz = (keys.f?1:0) - (keys.b?1:0);
    if (mx || mz){
      release(); touched();
      camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
      right.set(-fwd.z, 0, fwd.x);
      var sp = Math.max(8, goal.r*.7) * dt;
      goal.t.addScaledVector(fwd, mz*sp).addScaledVector(right, mx*sp);
      if (goal.t.length() > OUTER + 60) goal.t.setLength(OUTER + 60);
    }
    if (focused >= 0){ tmp.copy(nodes[focused].pos); tmp.y = 2.4; goal.t.copy(tmp); }
    else if (!travel && !nPointers && now - lastInput > 3500) goal.th += dt * .035;

    // amortissement
    var k = 1 - Math.exp(-dt*(cur.r > 200 ? 1.4 : 2.8)), k2 = 1 - Math.exp(-dt*(cur.r > 200 ? 1.4 : 5));
    cur.t.lerp(goal.t, travel ? 1 - Math.exp(-dt*6) : (focused >= 0 ? k2*.6 + k*.4 : k));
    cur.r += (goal.r - cur.r)*k; cur.th += (goal.th - cur.th)*k2; cur.ph += (goal.ph - cur.ph)*k2;
    cur.ox += (goal.ox - cur.ox)*k; cur.oy += (goal.oy - cur.oy)*k;
    var sp2 = Math.sin(cur.ph);
    camera.position.set(cur.t.x + cur.r*sp2*Math.sin(cur.th), Math.max(.8, cur.t.y + cur.r*Math.cos(cur.ph)), cur.t.z + cur.r*sp2*Math.cos(cur.th));
    camera.lookAt(cur.t);
    if (Math.abs(cur.ox) > .5 || Math.abs(cur.oy) > .5) camera.setViewOffset(W, H, cur.ox, cur.oy, W, H);
    else camera.clearViewOffset();
    camera.updateMatrixWorld();

    // survol
    if (mouseDirty && !nPointers){
      mouseDirty = false;
      var hv = pickAt(mouseXY[0], mouseXY[1]);
      if (hv !== hoverIdx){
        hoverIdx = hv; canvas.classList.toggle('hover', hv >= -1);
        for (var qq=0; qq<labels.length; qq++) labels[qq].classList.toggle('hot', qq === hv);
      }
    }

    renderer.render(scene, camera);

    // étiquettes sous chaque équipement
    var far = cur.r > 190;
    for (var j=0; j<nodes.length; j++){
      var nd = nodes[j], el = labels[j];
      v.copy(nd.base);
      var dist = v.distanceTo(camera.position);
      v.project(camera);
      var visible = !far && focused < 0 && !travel && v.z < 1 && v.z > -1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
      el.classList.toggle('hide', !visible);
      if (visible){
        var sx = (v.x*.5 + .5)*W, sy = (-v.y*.5 + .5)*H;
        var rad = 1.2 / dist * H * focalK;
        el.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + (sy + rad + 6).toFixed(1) + 'px,0) translateX(-50%)';
      }
    }
  }

  api = {
    focus: focusNode,
    overview: goOverview,
    run: function(on){
      if (on && !running){ running = true; clock.getDelta(); resize(); frame(); }
      else if (!on && running){ running = false; cancelAnimationFrame(raf); }
    }
  };
  new MutationObserver(setOffsets).observe(body, {attributes:true, attributeFilter:['class']});

  frame();
  return true;
}

if (window.THREE) window.__boot();
else setTimeout(function(){ window.__boot(); }, 2500);
};
</script>
</body>
</html>
